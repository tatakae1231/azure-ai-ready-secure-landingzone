name: "Azure AI SLZ - Terraform Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'landingzones/**'
      - 'modules/**'
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'landingzones/**'
      - 'modules/**'

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan-apply:
    name: "Deploy Environment"
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, sandbox, prod] # Targets specified environments
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-enterprise-tfstate-${{ matrix.environment }}-01" \
            -backend-config="storage_account_name=stenterprisestate${{ matrix.environment }}01" \
            -backend-config="container_name=tfstate-ai-landingzone" \
            -backend-config="key=${{ matrix.environment }}.ai-slz.tfstate"

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply (On Main Merge Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan
